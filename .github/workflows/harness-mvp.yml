name: Harness MVP offline checks
on:
  push:
    paths: ['incubator/agent-harness/**', '.github/workflows/harness-mvp.yml']
  pull_request:
    paths: ['incubator/agent-harness/**', '.github/workflows/harness-mvp.yml']
permissions:
  contents: read
jobs:
  offline:
    strategy:
      # 一个系统失败时，保留另一个系统的独立诊断结果。
      fail-fast: false
      matrix:
        # Python 3.12.8 有 Ubuntu 24.04 安装包，尚无 26.04 安装包。
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: incubator/agent-harness
    steps:
      - uses: actions/checkout@v4
        with:
          # 只检出这项检查需要的源码，避开历史资料中的超长文件名。
          sparse-checkout: |
            incubator/agent-harness
      - uses: actions/setup-python@v5
        with:
          python-version-file: incubator/agent-harness/.python-version
      - run: python -m pip install uv==0.13.9
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests
      - run: uv run --locked ruff format --check src tests
      - run: uv run --locked mypy src tests
      - run: uv run --locked coverage run -m unittest discover -s tests -v
      - run: uv run --locked coverage report
