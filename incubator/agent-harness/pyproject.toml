[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[project]
name = "harness-agent"
version = "0.1.0"
description = "A small, readable single-agent tool loop"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff", "mypy", "coverage"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true

[tool.coverage.run]
branch = true
source = ["harness_agent"]
