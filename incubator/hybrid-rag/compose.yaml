name: hybrid-rag

x-model: &model
  image: hybrid-rag-models:0.1.0
  environment: &model-env
    HF_HOME: /models/hf
    HF_HUB_DISABLE_XET: '1'
    HF_HUB_DOWNLOAD_TIMEOUT: '120'
    HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    TOKENIZERS_PARALLELISM: 'false'
    OMP_NUM_THREADS: ${MODEL_THREADS:-2}
    MKL_NUM_THREADS: ${MODEL_THREADS:-2}
  volumes:
    - model-cache:/models/hf
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 15m

x-java: &java
  image: hybrid-rag-java:0.1.0
  environment:
    ENCODER_URL: http://encoder:8000
    RERANKER_URL: http://reranker:8000
    QDRANT_URL: http://qdrant:6333
    RAG_COLLECTION: ${RAG_COLLECTION:-rag_chunks}
    RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-true}
    RAG_EVALUATION_ENABLED: ${RAG_EVALUATION_ENABLED:-false}
    RAG_QUERY_TIMEOUT: ${RAG_QUERY_TIMEOUT:-30s}
    RAG_INGEST_TIMEOUT: ${RAG_INGEST_TIMEOUT:-120s}
    RAG_RERANK_TIMEOUT: ${RAG_RERANK_TIMEOUT:-30s}
    RAG_CORPUS: /corpus
    RAG_INGEST_LOCK: /state/ingest.lock

services:
  qdrant:
    image: qdrant/qdrant:v1.17.0@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: [CMD-SHELL, "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3; read -r status <&3; [[ $$status == *\" 200 \"* ]]'"]
      interval: 3s
      timeout: 2s
      retries: 10
  encoder:
    <<: *model
    build: ./encoder
    environment:
      <<: *model-env
      MODEL_ROLE: encoder
  reranker:
    <<: *model
    pull_policy: never
    environment:
      <<: *model-env
      MODEL_ROLE: reranker
    depends_on:
      encoder:
        condition: service_healthy
  ingest:
    <<: *java
    build: ./rag-api
    command: [ingest]
    volumes:
      - ${RAG_CORPUS_DIR:-./sample/corpus}:/corpus:ro
      - ingest-state:/state
    depends_on:
      qdrant:
        condition: service_healthy
      encoder:
        condition: service_healthy
  rag-api:
    <<: *java
    pull_policy: never
    ports:
      - 127.0.0.1:${RAG_PORT:-8080}:8080
    healthcheck:
      test: [CMD-SHELL, "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; read -r status <&3; [[ $$status == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      ingest:
        condition: service_completed_successfully
      reranker:
        condition: service_healthy

volumes:
  model-cache:
  qdrant-storage:
  ingest-state:
