[project]
name = "hybrid-rag-model-service"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.12",
    "pydantic==2.11.7",
    "uvicorn==0.34.3",
    "flagembedding==1.3.5",
    "torch==2.8.0",
    "transformers==4.51.3",
    "huggingface-hub==0.34.4",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
